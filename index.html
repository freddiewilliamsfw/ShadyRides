<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shady Rides</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background-color: #fafafa;
        }
        .logo-container {
            width: 30%;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .logo {
            max-width: 100%;
            height: auto;
        }
        .content {
            width: 70%;
            padding: 20px 30px;
            box-sizing: border-box;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Weather Panel */
        .weather-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .weather-panel.sunny {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }
        .weather-panel.cloudy {
            background: linear-gradient(135deg, #89a0ae 0%, #b0c4ce 100%);
        }
        .weather-panel.rainy {
            background: linear-gradient(135deg, #4a6fa5 0%, #6b8cae 100%);
        }
        .weather-panel.night {
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
        }
        .weather-icon {
            font-size: 48px;
        }
        .weather-details {
            flex: 1;
        }
        .weather-temp {
            font-size: 28px;
            font-weight: bold;
        }
        .weather-desc {
            font-size: 14px;
            opacity: 0.9;
        }
        .weather-extra {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }
        .weather-extra span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .weather-loading {
            opacity: 0.7;
            font-style: italic;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-row label {
            min-width: 200px;
            color: #444;
        }
        select, button, input {
            margin: 5px 0;
            padding: 8px 12px;
            height: 44px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        select, button {
            background-color: #fff;
            color: #333;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            font-weight: 500;
            padding: 8px 20px;
        }
        button:hover {
            background-color: #5a6fd6;
        }
        #routeSelect {
            background-image: url('routebutton.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: none;
            color: white;
            width: 150px;
            height: 80px;
            padding: 5px 10px;
            text-align: center;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            cursor: pointer;
            border-radius: 0;
        }
        #timeInput {
            width: 130px;
        }
        #error {
            color: #e53e3e;
            background-color: #fed7d7;
            padding: 10px 15px;
            border-radius: 6px;
            display: none;
        }
        #error.show {
            display: block;
        }

        /* Result Panel */
        .result-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .result-panel.show {
            display: block;
        }
        .result-header {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        /* Bus Visualization */
        .bus-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .bus-visual {
            position: relative;
            width: 200px;
            height: 320px;
        }
        .bus-body {
            width: 120px;
            height: 280px;
            background: #e53935;
            border-radius: 20px 20px 10px 10px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .bus-front {
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 60px;
            background: #333;
            border-radius: 15px 15px 0 0;
        }
        .bus-windows {
            position: absolute;
            top: 70px;
            left: 10px;
            right: 10px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .window-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .window {
            width: 40px;
            height: 35px;
            background: #90caf9;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .window.highlighted {
            background: #4caf50;
            box-shadow: 0 0 15px #4caf50;
        }
        .window.dimmed {
            background: #607d8b;
            opacity: 0.6;
        }
        .side-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        .side-label.left {
            left: -35px;
        }
        .side-label.right {
            right: -40px;
        }
        .direction-arrow {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #333;
        }

        /* Recommendation Details */
        .recommendation-details {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #718096;
        }
        .detail-value {
            color: #2d3748;
            font-weight: 500;
        }

        /* Weather Impact Badge */
        .weather-impact {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
        }
        .weather-impact.high {
            background: #fed7d7;
            color: #c53030;
        }
        .weather-impact.medium {
            background: #feebc8;
            color: #c05621;
        }
        .weather-impact.low {
            background: #c6f6d5;
            color: #276749;
        }
        .weather-impact.none {
            background: #e2e8f0;
            color: #4a5568;
        }

        /* Special Messages */
        .special-message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #4a5568;
        }
        .special-message .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            .logo-container {
                width: 100%;
                padding: 15px;
                max-height: 150px;
            }
            .logo {
                max-height: 120px;
                width: auto;
            }
            .content {
                width: 100%;
                padding: 15px;
            }
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .input-row label {
                min-width: auto;
                margin-bottom: 5px;
            }
            #routeSelect {
                width: 100%;
            }
            #timeInput {
                width: 100%;
            }
            .weather-panel {
                flex-direction: column;
                text-align: center;
            }
            .weather-extra {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="srlogo.png" alt="Shady Rides Logo" class="logo">
    </div>
    <div class="content">
        <h1>Shady Rides</h1>
        <p class="subtitle">Find the shady side of your bus journey in London!</p>

        <!-- Weather Panel -->
        <div class="weather-panel" id="weatherPanel">
            <div class="weather-icon" id="weatherIcon">...</div>
            <div class="weather-details">
                <div class="weather-temp" id="weatherTemp">Loading weather...</div>
                <div class="weather-desc" id="weatherDesc">Fetching current conditions in London</div>
            </div>
            <div class="weather-extra" id="weatherExtra">
                <span id="cloudCover">Cloud: --%</span>
                <span id="uvIndex">UV: --</span>
                <span id="sunTimes">Sunrise: -- | Sunset: --</span>
            </div>
        </div>

        <div class="input-row">
            <label for="routeSelect">Which bus are you getting?</label>
            <select id="routeSelect">
                <option value="">Select a route</option>
            </select>
            <input type="time" id="timeInput">
        </div>

        <div class="input-row">
            <select id="runSelect" style="display: none;">
                <option value="">Select a direction</option>
            </select>
        </div>

        <div class="input-row">
            <select id="startStop" style="display: none;">
                <option value="">Select start stop</option>
            </select>
        </div>

        <div class="input-row">
            <select id="endStop" style="display: none;">
                <option value="">Select end stop</option>
            </select>
        </div>

        <div class="input-row">
            <button id="calculateBtn" onclick="calculateShade()" style="display: none;">Calculate Best Seat</button>
        </div>

        <div class="input-row">
            <button onclick="resetApp()" id="resetButton" style="display: none;">Check a new ride</button>
        </div>

        <p id="error"></p>

        <!-- Result Panel -->
        <div class="result-panel" id="resultPanel">
            <div class="result-header" id="resultHeader"></div>

            <div class="bus-container">
                <div class="bus-visual">
                    <div class="direction-arrow" id="directionArrow">^</div>
                    <div class="bus-body">
                        <div class="bus-front"></div>
                        <div class="bus-windows">
                            <div class="window-row">
                                <div class="window" data-side="left"></div>
                                <div class="window" data-side="right"></div>
                            </div>
                            <div class="window-row">
                                <div class="window" data-side="left"></div>
                                <div class="window" data-side="right"></div>
                            </div>
                            <div class="window-row">
                                <div class="window" data-side="left"></div>
                                <div class="window" data-side="right"></div>
                            </div>
                            <div class="window-row">
                                <div class="window" data-side="left"></div>
                                <div class="window" data-side="right"></div>
                            </div>
                        </div>
                    </div>
                    <span class="side-label left">LEFT</span>
                    <span class="side-label right">RIGHT</span>
                </div>
            </div>

            <div id="specialMessage" class="special-message" style="display: none;"></div>

            <div class="recommendation-details" id="recommendationDetails">
                <div class="detail-row">
                    <span class="detail-label">Bus Direction</span>
                    <span class="detail-value" id="detailDirection">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Sun Position</span>
                    <span class="detail-value" id="detailSunPos">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Current Weather</span>
                    <span class="detail-value" id="detailWeather">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Cloud Cover</span>
                    <span class="detail-value" id="detailClouds">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">UV Index</span>
                    <span class="detail-value" id="detailUV">--</span>
                </div>
            </div>

            <div id="weatherImpactBadge" class="weather-impact"></div>
        </div>
    </div>

    <script>
        let busRoutes = {};
        let weatherData = null;

        // London coordinates
        const LONDON_LAT = 51.5074;
        const LONDON_LON = -0.1278;

        // Fetch weather data from Open-Meteo API
        async function fetchWeather() {
            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${LONDON_LAT}&longitude=${LONDON_LON}&current=temperature_2m,weather_code,cloud_cover,is_day&hourly=uv_index&daily=sunrise,sunset&timezone=Europe/London&forecast_days=1`
                );

                if (!response.ok) throw new Error('Weather fetch failed');

                weatherData = await response.json();
                updateWeatherDisplay();
            } catch (error) {
                console.error('Weather error:', error);
                document.getElementById('weatherTemp').textContent = 'Weather unavailable';
                document.getElementById('weatherDesc').textContent = 'Using time-based sun estimation';
            }
        }

        function getWeatherDescription(code) {
            const weatherCodes = {
                0: { desc: 'Clear sky', icon: '☀️', type: 'sunny' },
                1: { desc: 'Mainly clear', icon: '🌤️', type: 'sunny' },
                2: { desc: 'Partly cloudy', icon: '⛅', type: 'sunny' },
                3: { desc: 'Overcast', icon: '☁️', type: 'cloudy' },
                45: { desc: 'Foggy', icon: '🌫️', type: 'cloudy' },
                48: { desc: 'Depositing rime fog', icon: '🌫️', type: 'cloudy' },
                51: { desc: 'Light drizzle', icon: '🌧️', type: 'rainy' },
                53: { desc: 'Moderate drizzle', icon: '🌧️', type: 'rainy' },
                55: { desc: 'Dense drizzle', icon: '🌧️', type: 'rainy' },
                61: { desc: 'Slight rain', icon: '🌧️', type: 'rainy' },
                63: { desc: 'Moderate rain', icon: '🌧️', type: 'rainy' },
                65: { desc: 'Heavy rain', icon: '🌧️', type: 'rainy' },
                71: { desc: 'Slight snow', icon: '🌨️', type: 'cloudy' },
                73: { desc: 'Moderate snow', icon: '🌨️', type: 'cloudy' },
                75: { desc: 'Heavy snow', icon: '🌨️', type: 'cloudy' },
                80: { desc: 'Slight rain showers', icon: '🌦️', type: 'rainy' },
                81: { desc: 'Moderate rain showers', icon: '🌦️', type: 'rainy' },
                82: { desc: 'Violent rain showers', icon: '⛈️', type: 'rainy' },
                95: { desc: 'Thunderstorm', icon: '⛈️', type: 'rainy' },
                96: { desc: 'Thunderstorm with hail', icon: '⛈️', type: 'rainy' },
                99: { desc: 'Thunderstorm with heavy hail', icon: '⛈️', type: 'rainy' }
            };
            return weatherCodes[code] || { desc: 'Unknown', icon: '❓', type: 'cloudy' };
        }

        function updateWeatherDisplay() {
            if (!weatherData) return;

            const current = weatherData.current;
            const daily = weatherData.daily;
            const hourly = weatherData.hourly;

            const weather = getWeatherDescription(current.weather_code);
            const isDay = current.is_day === 1;

            // Get current hour's UV index
            const now = new Date();
            const currentHour = now.getHours();
            const uvIndex = hourly.uv_index[currentHour] || 0;

            // Update weather panel
            const panel = document.getElementById('weatherPanel');
            panel.className = 'weather-panel ' + (isDay ? weather.type : 'night');

            document.getElementById('weatherIcon').textContent = isDay ? weather.icon : '🌙';
            document.getElementById('weatherTemp').textContent = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById('weatherDesc').textContent = isDay ? weather.desc : 'Night time';
            document.getElementById('cloudCover').textContent = `Cloud: ${current.cloud_cover}%`;
            document.getElementById('uvIndex').textContent = `UV: ${uvIndex.toFixed(1)}`;

            // Format sunrise/sunset
            const sunrise = new Date(daily.sunrise[0]).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const sunset = new Date(daily.sunset[0]).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('sunTimes').textContent = `Sunrise: ${sunrise} | Sunset: ${sunset}`;

            // Store additional data for calculations
            weatherData.parsed = {
                cloudCover: current.cloud_cover,
                uvIndex: uvIndex,
                isDay: isDay,
                weatherType: weather.type,
                weatherDesc: weather.desc,
                sunrise: daily.sunrise[0],
                sunset: daily.sunset[0]
            };
        }

        function calculateBearing(startEasting, startNorthing, endEasting, endNorthing) {
            const y = endEasting - startEasting;
            const x = endNorthing - startNorthing;
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            if (bearing < 0) {
                bearing += 360;
            }
            return bearing;
        }

        function getRunDirection(bearing) {
            if ((bearing >= 0 && bearing < 45) || (bearing >= 315 && bearing <= 360)) {
                return 'Northbound';
            } else if (bearing >= 45 && bearing < 135) {
                return 'Eastbound';
            } else if (bearing >= 135 && bearing < 225) {
                return 'Southbound';
            } else {
                return 'Westbound';
            }
        }

        function getDirectionArrow(bearing) {
            if ((bearing >= 337.5 || bearing < 22.5)) return '↑';
            if (bearing >= 22.5 && bearing < 67.5) return '↗';
            if (bearing >= 67.5 && bearing < 112.5) return '→';
            if (bearing >= 112.5 && bearing < 157.5) return '↘';
            if (bearing >= 157.5 && bearing < 202.5) return '↓';
            if (bearing >= 202.5 && bearing < 247.5) return '↙';
            if (bearing >= 247.5 && bearing < 292.5) return '←';
            if (bearing >= 292.5 && bearing < 337.5) return '↖';
            return '↑';
        }

        function calculateSunPosition(time) {
            // Use actual sunrise/sunset from weather data if available
            if (weatherData && weatherData.parsed) {
                const sunrise = new Date(weatherData.parsed.sunrise);
                const sunset = new Date(weatherData.parsed.sunset);

                const [hours, minutes] = time.split(':').map(Number);
                const now = new Date();
                now.setHours(hours, minutes, 0, 0);

                const sunriseTime = sunrise.getHours() + sunrise.getMinutes() / 60;
                const sunsetTime = sunset.getHours() + sunset.getMinutes() / 60;
                const currentTime = hours + minutes / 60;

                // Before sunrise or after sunset = night
                if (currentTime < sunriseTime || currentTime > sunsetTime) {
                    return { position: -1, isNight: true };
                }

                // Calculate sun position based on actual daylight hours
                const daylightHours = sunsetTime - sunriseTime;
                const hoursSinceSunrise = currentTime - sunriseTime;
                const dayProgress = hoursSinceSunrise / daylightHours;

                // Sun moves from 90° (East at sunrise) through 180° (South at noon) to 270° (West at sunset)
                const sunPosition = 90 + (dayProgress * 180);

                return { position: sunPosition, isNight: false };
            }

            // Fallback to simple calculation
            const [hours, minutes] = time.split(':').map(Number);
            const timeAsDecimal = hours + minutes / 60;

            // Simple day/night check (6 AM to 6 PM)
            if (timeAsDecimal < 6 || timeAsDecimal > 18) {
                return { position: -1, isNight: true };
            }

            let sunPosition = ((timeAsDecimal - 6) * 15 + 90) % 360;
            if (sunPosition < 0) sunPosition += 360;

            return { position: sunPosition, isNight: false };
        }

        function getCompassDirection(bearing) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(bearing / 45) % 8];
        }

        function getShadySide(bearing, sunPosition) {
            const relativeBearing = (bearing - sunPosition + 360) % 360;
            if (relativeBearing === 0 || relativeBearing === 180) {
                return "either";
            } else if (relativeBearing > 0 && relativeBearing < 180) {
                return "right";
            } else {
                return "left";
            }
        }

        function getSunPositionDescription(position) {
            if (position < 0) return 'Below horizon';
            if (position >= 80 && position < 100) return 'Low in the East (morning)';
            if (position >= 100 && position < 135) return 'Southeast (mid-morning)';
            if (position >= 135 && position < 170) return 'High in the South';
            if (position >= 170 && position < 190) return 'Directly South (noon)';
            if (position >= 190 && position < 225) return 'High in the South';
            if (position >= 225 && position < 260) return 'Southwest (afternoon)';
            if (position >= 260 && position <= 280) return 'Low in the West (evening)';
            return `${position.toFixed(0)}°`;
        }

        function getWeatherImpact() {
            if (!weatherData || !weatherData.parsed) {
                return { level: 'medium', text: 'Shade matters - find sun protection', reason: 'Weather data unavailable' };
            }

            const { cloudCover, uvIndex, isDay, weatherType } = weatherData.parsed;

            if (!isDay) {
                return { level: 'none', text: 'No sun to worry about', reason: 'It\'s night time' };
            }

            if (weatherType === 'rainy') {
                return { level: 'low', text: 'Shade doesn\'t matter much', reason: 'Rain and clouds are blocking the sun' };
            }

            if (cloudCover >= 80) {
                return { level: 'low', text: 'Shade doesn\'t matter much', reason: `${cloudCover}% cloud cover blocking sunlight` };
            }

            if (cloudCover >= 50) {
                if (uvIndex >= 3) {
                    return { level: 'medium', text: 'Some shade benefit', reason: `Partial clouds but UV index is ${uvIndex.toFixed(1)}` };
                }
                return { level: 'low', text: 'Shade benefit is minimal', reason: `${cloudCover}% cloud cover with low UV` };
            }

            if (uvIndex >= 6) {
                return { level: 'high', text: 'Shade is highly recommended!', reason: `High UV index of ${uvIndex.toFixed(1)} - protect your skin` };
            }

            if (uvIndex >= 3) {
                return { level: 'medium', text: 'Shade is beneficial', reason: `Moderate UV index of ${uvIndex.toFixed(1)}` };
            }

            return { level: 'medium', text: 'Shade offers comfort', reason: 'Clear skies but low UV' };
        }

        // Initialize app
        Promise.all([
            fetchWeather(),
            fetch('bus_routes.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(data => {
                    const rows = data.split('\n').slice(1);
                    rows.forEach(row => {
                        const [route, run, sequence, , , , stopName, easting, northing] = row.split(',');
                        if (!busRoutes[route]) {
                            busRoutes[route] = {};
                        }
                        if (!busRoutes[route][run]) {
                            busRoutes[route][run] = [];
                        }
                        busRoutes[route][run].push({
                            name: stopName,
                            easting: parseInt(easting),
                            northing: parseInt(northing),
                            sequence: parseInt(sequence)
                        });
                    });
                    for (let route in busRoutes) {
                        for (let run in busRoutes[route]) {
                            busRoutes[route][run].sort((a, b) => a.sequence - b.sequence);
                            const firstStop = busRoutes[route][run][0];
                            const lastStop = busRoutes[route][run][busRoutes[route][run].length - 1];
                            const bearing = calculateBearing(firstStop.easting, firstStop.northing, lastStop.easting, lastStop.northing);
                            busRoutes[route][run].direction = getRunDirection(bearing);
                        }
                    }
                    populateRouteSelect();
                    setCurrentTime();
                })
        ]).catch(error => {
            console.error('Error:', error);
            const errorEl = document.getElementById('error');
            errorEl.textContent = 'Error loading bus routes. Please try again later.';
            errorEl.classList.add('show');
        });

        function populateRouteSelect() {
            const select = document.getElementById('routeSelect');
            Object.keys(busRoutes).sort((a, b) => {
                // Sort numerically where possible
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return a.localeCompare(b);
            }).forEach(route => {
                const option = document.createElement('option');
                option.value = route;
                option.textContent = route;
                select.appendChild(option);
            });
        }

        function setCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('timeInput').value = `${hours}:${minutes}`;
        }

        document.getElementById('routeSelect').addEventListener('change', function() {
            resetSelections();
            if (this.value) {
                const runSelect = document.getElementById('runSelect');
                runSelect.innerHTML = '<option value="">Select a direction</option>';
                runSelect.style.display = 'block';

                const route = busRoutes[this.value];
                Object.keys(route).forEach(run => {
                    const option = document.createElement('option');
                    option.value = run;
                    option.textContent = `${route[run].direction} (Run ${run})`;
                    runSelect.appendChild(option);
                });
            }
        });

        document.getElementById('runSelect').addEventListener('change', function() {
            if (this.value) {
                const route = document.getElementById('routeSelect').value;
                const run = this.value;
                const stops = busRoutes[route][run] || [];

                const startSelect = document.getElementById('startStop');
                const endSelect = document.getElementById('endStop');
                startSelect.innerHTML = '<option value="">Select start stop</option>';
                endSelect.innerHTML = '<option value="">Select end stop</option>';

                stops.forEach((stop, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${stop.sequence}. ${stop.name}`;
                    startSelect.appendChild(option.cloneNode(true));
                    endSelect.appendChild(option);
                });

                startSelect.style.display = 'block';
                endSelect.style.display = 'block';
                document.getElementById('calculateBtn').style.display = 'block';
            }
        });

        function calculateShade() {
            const route = document.getElementById('routeSelect').value;
            const run = document.getElementById('runSelect').value;
            const startIndex = document.getElementById('startStop').value;
            const endIndex = document.getElementById('endStop').value;
            const time = document.getElementById('timeInput').value;

            if (!route || !run || startIndex === '' || endIndex === '' || !time) {
                alert('Please select a route, direction, both stops, and a time.');
                return;
            }

            const startStop = busRoutes[route][run][startIndex];
            const endStop = busRoutes[route][run][endIndex];

            const bearing = calculateBearing(startStop.easting, startStop.northing, endStop.easting, endStop.northing);
            const compassDirection = getCompassDirection(bearing);
            const directionName = getRunDirection(bearing);

            const sunData = calculateSunPosition(time);
            const weatherImpact = getWeatherImpact();

            // Update direction arrow
            document.getElementById('directionArrow').textContent = getDirectionArrow(bearing);

            // Show result panel
            const resultPanel = document.getElementById('resultPanel');
            resultPanel.classList.add('show');

            const specialMessage = document.getElementById('specialMessage');
            const recommendationDetails = document.getElementById('recommendationDetails');
            const busWindows = document.querySelectorAll('.window');

            // Reset windows
            busWindows.forEach(w => {
                w.classList.remove('highlighted', 'dimmed');
            });

            // Check special conditions
            if (sunData.isNight) {
                // Night time
                specialMessage.innerHTML = '<span class="emoji">🌙</span>It\'s night time - no sun to worry about!<br>Sit wherever you like.';
                specialMessage.style.display = 'block';
                recommendationDetails.style.display = 'none';
                document.getElementById('resultHeader').textContent = 'Night Ride';
                document.getElementById('weatherImpactBadge').className = 'weather-impact none';
                document.getElementById('weatherImpactBadge').textContent = 'No sun exposure';
                document.getElementById('resetButton').style.display = 'block';
                return;
            }

            if (weatherImpact.level === 'low' || weatherImpact.level === 'none') {
                // Cloudy/rainy - shade doesn't matter much
                const emoji = weatherData?.parsed?.weatherType === 'rainy' ? '🌧️' : '☁️';
                specialMessage.innerHTML = `<span class="emoji">${emoji}</span>${weatherImpact.text}<br>${weatherImpact.reason}`;
                specialMessage.style.display = 'block';
                recommendationDetails.style.display = 'block';
            } else {
                specialMessage.style.display = 'none';
                recommendationDetails.style.display = 'block';
            }

            const shadySide = getShadySide(bearing, sunData.position);

            // Update result header
            if (shadySide === 'either') {
                document.getElementById('resultHeader').textContent = 'Sit on either side!';
            } else {
                document.getElementById('resultHeader').textContent = `Sit on the ${shadySide.toUpperCase()} side`;

                // Highlight appropriate windows
                busWindows.forEach(w => {
                    if (w.dataset.side === shadySide) {
                        w.classList.add('highlighted');
                    } else {
                        w.classList.add('dimmed');
                    }
                });
            }

            // Update details
            document.getElementById('detailDirection').textContent = `${directionName} (${compassDirection}, ${bearing.toFixed(0)}°)`;
            document.getElementById('detailSunPos').textContent = getSunPositionDescription(sunData.position);
            document.getElementById('detailWeather').textContent = weatherData?.parsed?.weatherDesc || 'Unknown';
            document.getElementById('detailClouds').textContent = weatherData?.parsed ? `${weatherData.parsed.cloudCover}%` : 'Unknown';
            document.getElementById('detailUV').textContent = weatherData?.parsed ? weatherData.parsed.uvIndex.toFixed(1) : 'Unknown';

            // Update weather impact badge
            const badge = document.getElementById('weatherImpactBadge');
            badge.className = `weather-impact ${weatherImpact.level}`;
            badge.textContent = weatherImpact.text;

            document.getElementById('resetButton').style.display = 'block';
        }

        function resetSelections() {
            document.getElementById('runSelect').style.display = 'none';
            document.getElementById('startStop').style.display = 'none';
            document.getElementById('endStop').style.display = 'none';
            document.getElementById('calculateBtn').style.display = 'none';
            document.getElementById('resultPanel').classList.remove('show');
        }

        function resetApp() {
            document.getElementById('routeSelect').value = '';
            resetSelections();
            document.getElementById('resetButton').style.display = 'none';
            setCurrentTime();
            // Refresh weather
            fetchWeather();
        }
    </script>
</body>
</html>
